version: "3.9"
services:
  server:
    build: ./server
    container_name: story-server
    env_file:
      - ./server/.env
    ports:
      - "3000:3000"

  client:
    build: ./client
    container_name: story-client
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_PROXY_TARGET=http://server:3000
    ports:
      - "5173:5173"
    depends_on:
      - server